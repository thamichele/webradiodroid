<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https: http:; media-src 'self' blob: http://127.0.0.1:*; connect-src 'self' https: http:; worker-src 'self' blob:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebRadioDroid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="sprite" width="0" height="0" aria-hidden="true">
    <defs>
      <symbol id="i-radio" viewBox="0 0 24 24"><path d="M5 10h14a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2zM8 10l9-5.5M8 12.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5zM13.5 13.5h4M13.5 16.5h4"/></symbol>
      <symbol id="i-app" viewBox="0 0 50 50"><rect width="50" height="50" rx="6" fill="#1C1B1A" stroke="none"/><g transform="translate(1.970 1.490) scale(1.9192)" stroke-width="1.8"><path d="M5 10h14a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2zM8 10l9-5.5M8 12.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5zM13.5 13.5h4M13.5 16.5h4"/></g></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 6v12l-9-6zM6 6v12"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 6v12l9-6zM18 6v12"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="18.5" r="1.2" fill="currentColor"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><path d="M10.5 4a6.5 6.5 0 1 0 0 13a6.5 6.5 0 1 0 0-13zM20 20l-4.8-4.8"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
      <symbol id="i-timer" viewBox="0 0 24 24"><path d="M12 7a7 7 0 1 0 0 14a7 7 0 1 0 0-14zM12 10.5V14l2.2 1.6M10 3h4M12 3v4M18.5 6.5l1.2-1.2"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6l6-6"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4zM15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4zM16 9.5l5 5M21 9.5l-5 5"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 5l3 3v2H7v-2l3-3zM12 14v6"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"/></symbol>
      <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></symbol>
      <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 19h14"/></symbol>
      <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c1.2 0 2-.8 2-1.8c0-.5-.2-.9-.5-1.2c-.3-.3-.5-.7-.5-1.2c0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8zM7.5 11.5h.01M10 7.5h.01M14.5 7.5h.01M17 11h.01"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5l9-10"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 11v5M12 7.8v.2"/></symbol>
    </defs>
  </svg>

  <header class="topbar">
    <div class="brand">
      <svg class="brand-icon app-icon" aria-hidden="true"><use href="#i-app"/></svg>
      <span class="brand-name">WebRadioDroid</span>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-tonal" id="add-button"><svg class="icon"><use href="#i-plus"/></svg><span data-i18n="addStation"></span></button>
      <button class="icon-btn" id="menu-button" data-i18n-title="menu"><svg class="icon"><use href="#i-more"/></svg></button>
    </div>
  </header>

  <main class="layout">
    <section class="collection" id="collection" aria-live="polite"></section>

    <aside class="player" id="player" aria-label="Player">
      <div class="player-top">
        <button class="icon-btn player-close" id="player-close" data-i18n-title="close"><svg class="icon"><use href="#i-down"/></svg></button>
        <span class="player-headline" data-i18n="nowPlaying"></span>
        <span class="player-top-spacer"></span>
      </div>
      <div class="player-art-wrap">
        <div class="player-art" id="player-art"><svg class="icon placeholder-icon"><use href="#i-radio"/></svg></div>
      </div>
      <div class="equalizer" id="equalizer" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div class="player-texts">
        <div class="player-title" id="player-title"></div>
        <div class="player-artist" id="player-artist"></div>
        <div class="player-station" id="player-station"></div>
      </div>
      <div class="player-controls">
        <button class="icon-btn icon-btn-lg" id="prev-button" data-i18n-title="previous"><svg class="icon"><use href="#i-prev"/></svg></button>
        <button class="play-btn" id="play-button" data-i18n-title="playStop"><svg class="icon"><use href="#i-play"/></svg><span class="spinner"></span></button>
        <button class="icon-btn icon-btn-lg" id="next-button" data-i18n-title="next"><svg class="icon"><use href="#i-next"/></svg></button>
      </div>
      <div class="player-extra">
        <button class="chip" id="sleep-button"><svg class="icon"><use href="#i-timer"/></svg><span id="sleep-label"></span></button>
        <div class="volume">
          <button class="icon-btn" id="mute-button" data-i18n-title="mute"><svg class="icon"><use href="#i-volume"/></svg></button>
          <input type="range" id="volume" min="0" max="100" step="1" data-i18n-title="volume">
        </div>
      </div>
    </aside>
  </main>

  <!-- compact player bar for narrow windows: a click opens the full player -->
  <div class="mini-player" id="mini-player" role="button" tabindex="0">
    <div class="mini-art" id="mini-art"><svg class="icon placeholder-icon"><use href="#i-radio"/></svg></div>
    <div class="mini-texts">
      <div class="mini-station" id="mini-station"></div>
      <div class="mini-title" id="mini-title"></div>
    </div>
    <button class="play-btn play-btn-sm" id="mini-play"><svg class="icon"><use href="#i-play"/></svg><span class="spinner"></span></button>
  </div>

  <!-- menus -->
  <div class="menu" id="app-menu" role="menu" hidden>
    <button role="menuitem" data-action="import"><svg class="icon"><use href="#i-import"/></svg><span data-i18n="importM3u"></span></button>
    <button role="menuitem" data-action="export"><svg class="icon"><use href="#i-export"/></svg><span data-i18n="exportM3u"></span></button>
    <button role="menuitem" data-action="accent"><svg class="icon"><use href="#i-palette"/></svg><span data-i18n="accentColor"></span></button>
    <button role="menuitem" data-action="about"><svg class="icon"><use href="#i-info"/></svg><span data-i18n="about"></span></button>
  </div>
  <div class="menu" id="station-menu" role="menu" hidden>
    <button role="menuitem" data-action="pin"><svg class="icon"><use href="#i-pin"/></svg><span data-i18n="pin"></span></button>
    <button role="menuitem" data-action="rename"><svg class="icon"><use href="#i-edit"/></svg><span data-i18n="rename"></span></button>
    <button role="menuitem" data-action="homepage"><svg class="icon"><use href="#i-globe"/></svg><span data-i18n="homepage"></span></button>
    <button role="menuitem" data-action="remove" class="danger"><svg class="icon"><use href="#i-trash"/></svg><span data-i18n="remove"></span></button>
  </div>

  <!-- add station -->
  <dialog id="add-dialog" class="dialog dialog-wide">
    <form method="dialog" class="dialog-inner">
      <div class="dialog-head">
        <h2 data-i18n="addStation"></h2>
        <button class="icon-btn" value="cancel" data-i18n-title="close"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div class="search-field">
        <svg class="icon"><use href="#i-search"/></svg>
        <input type="text" id="search-input" autocomplete="off" spellcheck="false" data-i18n-placeholder="searchHint">
      </div>
      <p class="hint" data-i18n="searchHelp"></p>
      <div class="results" id="search-results"></div>
    </form>
  </dialog>

  <!-- rename -->
  <dialog id="rename-dialog" class="dialog">
    <form method="dialog" class="dialog-inner">
      <h2 data-i18n="rename"></h2>
      <input type="text" id="rename-input" class="text-input" spellcheck="false">
      <div class="dialog-actions">
        <button class="btn btn-text" value="cancel" formnovalidate data-i18n="cancel"></button>
        <button class="btn btn-filled" value="ok" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <!-- remove -->
  <dialog id="remove-dialog" class="dialog">
    <form method="dialog" class="dialog-inner">
      <h2 data-i18n="removeTitle"></h2>
      <p id="remove-text"></p>
      <div class="dialog-actions">
        <button class="btn btn-text" value="cancel" data-i18n="cancel"></button>
        <button class="btn btn-filled btn-danger" value="ok" data-i18n="remove"></button>
      </div>
    </form>
  </dialog>

  <!-- sleep timer -->
  <dialog id="sleep-dialog" class="dialog">
    <form method="dialog" class="dialog-inner">
      <h2 data-i18n="sleepTimer"></h2>
      <p class="hint" data-i18n="sleepHelp"></p>
      <div class="sleep-options" id="sleep-options"></div>
      <div class="dialog-actions">
        <button class="btn btn-text" value="off" id="sleep-off" data-i18n="sleepOff"></button>
        <button class="btn btn-text" value="cancel" data-i18n="close"></button>
      </div>
    </form>
  </dialog>

  <!-- main color -->
  <dialog id="accent-dialog" class="dialog">
    <form method="dialog" class="dialog-inner">
      <h2 data-i18n="accentColor"></h2>
      <p class="hint" data-i18n="accentHelp"></p>
      <div class="accent-options" id="accent-options" role="radiogroup" data-i18n-title="accentColor"></div>
      <div class="dialog-actions">
        <button class="btn btn-text" value="cancel" data-i18n="close"></button>
      </div>
    </form>
  </dialog>

  <!-- about -->
  <dialog id="about-dialog" class="dialog">
    <form method="dialog" class="dialog-inner about">
      <svg class="about-icon app-icon" aria-hidden="true"><use href="#i-app"/></svg>
      <h2>WebRadioDroid</h2>
      <p class="hint" id="about-version"></p>
      <p data-i18n="aboutText"></p>
      <p class="hint"><a href="https://github.com/thamichele/webradiodroid" target="_blank" rel="noreferrer">github.com/thamichele/webradiodroid</a></p>
      <div class="dialog-actions">
        <button class="btn btn-filled" value="ok" data-i18n="close"></button>
      </div>
    </form>
  </dialog>

  <div class="snackbar" id="snackbar" role="status" hidden></div>

  <audio id="audio" preload="none"></audio>
  <script src="../node_modules/hls.js/dist/hls.light.min.js"></script>
  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
