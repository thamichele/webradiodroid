name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# read-only token by default - only the release job below may write
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      # the runner image ships the Android SDK (ANDROID_HOME), missing platforms are fetched by AGP
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # code quality report - does not block the build, the findings are listed in the log
      - name: Lint
        continue-on-error: true
        run: |
          ./gradlew --no-daemon lintDebug
          jq -r '.runs[].results[] | "\(.level): \(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine // 0) \(.message.text)"' app/build/reports/lint-results-debug.sarif

      - name: Show APK name, id and version
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for apk in app/build/outputs/apk/debug/*.apk; do
            echo "== $apk"
            "$AAPT2" dump badging "$apk" | grep -E "^(package|application-label|application-icon-160|launchable-activity)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: webradiodroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Builds the signed release APK and publishes it to WebRadioDroid's own F-Droid repository
  # (branch "fdroid", served at https://raw.githubusercontent.com/thamichele/webradiodroid/fdroid/repo).
  # Needs the repository secrets RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD; skipped without them.
  fdroid:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      # the version is set by hand in app/build.gradle.kts - a new release is built only for a version that has none yet,
      # the F-Droid repository is refreshed on every push (so changes to its description and icons go out right away)
      - name: Check signing secrets and version
        id: secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*val appVersionMajor = \([0-9]*\).*/\1/p' app/build.gradle.kts).$(sed -n 's/.*val appVersionMinor = \([0-9]*\).*/\1/p' app/build.gradle.kts).$(sed -n 's/.*val appVersionPatch = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          echo "Version in app/build.gradle.kts: $VERSION"
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::notice::Release secrets not set - no release, F-Droid repository not updated"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Version $VERSION has already been released - only the F-Droid repository is refreshed"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5
        if: steps.secrets.outputs.release == 'true'

      - name: Build release APK
        if: steps.secrets.outputs.release == 'true'
        run: |
          export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging app/build/outputs/apk/release/*.apk | grep -E "^(package|application-label:)"
          VERSION=$("$AAPT2" dump badging app/build/outputs/apk/release/*.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          cd "$RUNNER_TEMP"
          cp "$GITHUB_WORKSPACE"/app/build/outputs/apk/release/*.apk "WebRadioDroid-$VERSION.apk"
          sha256sum "WebRadioDroid-$VERSION.apk" > "WebRadioDroid-$VERSION.apk.sha256"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # every new version becomes a GitHub release with the signed APK and its SHA-256 attached
      - name: Create GitHub release
        if: steps.secrets.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "$RUNNER_TEMP/WebRadioDroid-$VERSION.apk" "$RUNNER_TEMP/WebRadioDroid-$VERSION.apk.sha256" \
            --title "WebRadioDroid $VERSION" \
            --notes "APK firmato. Gli aggiornamenti arrivano anche dal repository F-Droid https://raw.githubusercontent.com/thamichele/webradiodroid/fdroid/repo - impronta SHA-256 del certificato di firma: 6f:57:e2:9c:92:99:49:18:23:e1:9d:a5:e6:88:17:5f:62:2a:e1:4a:40:4b:7f:bb:2f:42:90:42:21:40:05:b0"

      # the F-Droid repository offers the latest three releases, with the description and icon from fdroid/metadata
      - name: Update F-Droid repository
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet fdroidserver
          mkdir -p fdroid-repo/repo
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 3 --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir fdroid-repo/repo
          done
          ls -l fdroid-repo/repo
          cp -r fdroid/metadata fdroid-repo/metadata
          # fdroid looks for repo_icon in its working folder and copies it to repo/icons/
          cp assets/webradiodroid/webradiodroid-icon-512.png fdroid-repo/icon.png
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > fdroid-repo/keystore.p12
          cd fdroid-repo
          cat > config.yml <<CONFIG
          sdk_path: $ANDROID_HOME
          repo_url: https://raw.githubusercontent.com/thamichele/webradiodroid/fdroid/repo
          repo_name: WebRadioDroid
          repo_description: Repository F-Droid personale di WebRadioDroid, la webradio per telefono e Android Auto
          repo_icon: icon.png
          archive_older: 3
          keystore: keystore.p12
          repo_keyalias: repo
          keystorepass: $RELEASE_KEYSTORE_PASSWORD
          keypass: $RELEASE_KEYSTORE_PASSWORD
          keydname: CN=WebRadioDroid F-Droid repo, O=thamichele
          CONFIG
          chmod 600 config.yml
          "$RUNNER_TEMP/venv/bin/fdroid" update --pretty
          echo "== repo fingerprint"
          keytool -list -v -storetype pkcs12 -keystore keystore.p12 -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias repo | grep "SHA256:"

      - name: Publish F-Droid repository
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # only the public repo/ folder is published - never keystore.p12 or config.yml
          mkdir publish && cp -r fdroid-repo/repo publish/repo
          cd publish
          git init -q -b fdroid
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo
          git commit -q -m "F-Droid repository: WebRadioDroid build ${GITHUB_RUN_NUMBER}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" fdroid
        env:
          GH_TOKEN: ${{ github.token }}
